# Benchmark catalog schema
# Each field below is documented with type, whether required, and meaning.

# --- Identity ---
name: string          # required. Short name used as filename (e.g. MusicBench)
full_name: string     # optional. Full title as in the paper
year: int             # required. Year of publication
arxiv_id: string      # optional. e.g. 2408.01337
url: string           # optional. Paper or dataset URL

# --- Task framing ---
task_type:            # required. List: ["comprehension", "captioning", "QA", "retrieval", "generation"]
  - string
primary_skill:        # required. The main capability tested (see skills list below)
  - string
# Skills taxonomy:
#   perception:    pitch, timbre, loudness, rhythm, tempo, onset, duration
#   structure:     melody, harmony, chord, key, meter, form, polyphony
#   knowledge:     genre, style, instrument, era, composer, theory
#   reasoning:     comparison, counting, ordering, analogy, inference
#   affect:        emotion, mood, valence, arousal

# --- Question format ---
question_format:      # required. ["MCQ", "open-ended", "fill-in-the-blank", "ranking"]
  - string
answer_type:          # required. ["categorical", "numeric", "text", "binary"]
  - string
n_choices: int        # optional. Number of MCQ choices (if MCQ)

# --- Audio coverage ---
coverage:
  n_items: int              # required. Total number of items
  audio_duration_range:     # optional. [min_sec, max_sec]
    - float
    - float
  genres:                   # optional. List of genres present
    - string
  instruments:              # optional. List of instruments present
    - string
  languages:                # optional. Languages of text (default: [en])
    - string
  audio_source: string      # optional. e.g. "YouTube", "NSynth", "studio recordings", "synthesized"
  real_vs_synth: string     # optional. "real", "synthetic", "mixed"

# --- Benchmark difficulty and usage ---
llm_only_score: float       # optional. Score of text-only LLM (no audio) — to be filled by exp_1
llm_only_model: string      # optional. Which LLM was used for the text-only baseline
sota_score: float           # optional. Best reported score
sota_model: string          # optional. Model achieving SOTA
human_score: float          # optional. Human performance if reported

used_in_papers:             # optional. List of paper arxiv IDs that evaluate on this benchmark
  - string

# --- Notes ---
notes: string               # optional. Free-text observations, caveats, known issues
